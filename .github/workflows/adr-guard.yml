name: ADR guard

# Decision files and config files change only in a pull request labelled `adr` (scripts/guard-adrs.mjs). The check runs
# on pull_request_target, so it is the base branch's workflow and script that run, and it never runs code from the pull
# request: the pull request's commits are only fetched as git data, and nothing is checked out or installed from them.
# The check reruns when labels change.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: adr-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  adr-guard:
    runs-on: ubuntu-latest
    steps:
      # The default ref for this trigger is the base branch, which is the only code this job runs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The merge result GitHub made of the pull request and the base is fetched as data (no checkout, no install). The
      # guard judges it against the base tip, so an ADR that the base accepted after the branch point stays frozen.
      # Without a merge ref, the pull request has conflicts.
      - name: Fetch the merge result as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/merge:refs/guard/head" || {
            echo "This pull request has merge conflicts; resolve them so it can be checked" >&2
            exit 1
          }
      - name: Run the guard
        env:
          GUARD_BASE: origin/${{ github.base_ref }}
          GUARD_HEAD: refs/guard/head
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/guard-adrs.mjs
