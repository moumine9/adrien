name: Docker

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - scripts/docker-smoke.sh
      - .github/workflows/docker.yml
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The image installs the published adrien package from npm, not this checkout. So this proves that the Dockerfile
      # builds and that the released server starts and enforces its token. Changes under packages/ reach the image only
      # once they are released.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: adrien:test
          build-args: ADRIEN_PACKAGE=adrien@latest
      - name: Smoke test the container
        run: bash scripts/docker-smoke.sh adrien:test

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: names
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # release.yml publishes the npm package for this tag at the same time. The image installs it, so wait for it.
      - name: Wait for the npm package
        # The registry lists a version in its metadata minutes before it serves the package file, and `npm install` in
        # the image needs the file: v0.5.0 failed here with a 404 while `npm view` already answered. So wait for the
        # tarball itself, and allow 45 minutes, since v0.5.0 took about 15.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          deadline=$((SECONDS + 2700))
          until TARBALL="$(npm view --prefer-online "adrien@${VERSION}" dist.tarball 2>/dev/null)" \
            && [ -n "$TARBALL" ] && curl -fsSI --max-time 20 "$TARBALL" >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "adrien@${VERSION} is still not downloadable from npm after 45 minutes" >&2
              exit 1
            fi
            sleep 30
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.image }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
      # Test the image of THIS release before anything is pushed: the build job only ever sees the previous release.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: adrien:test
          build-args: ADRIEN_PACKAGE=adrien@${{ steps.names.outputs.version }}
      - name: Smoke test the release image
        run: bash scripts/docker-smoke.sh adrien:test
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ADRIEN_PACKAGE=adrien@${{ steps.names.outputs.version }}
