name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: The tag matches the package version
        run: test "v$(node -p "require('./packages/cli/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm install -g "npm@>=11.5.1"
      - run: pnpm install --frozen-lockfile
      - name: The changelog has an entry for this version
        run: pnpm changelog:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: npm publish --provenance --access public
        working-directory: packages/cli
