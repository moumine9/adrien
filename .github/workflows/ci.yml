name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  # Decision files change only in a pull request labelled `adr` (scripts/guard-adrs.mjs). The label check reruns on
  # label changes. Its own job, so the `test` check names stay as they are.
  adr-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/guard-adrs.mjs
        env:
          GUARD_BASE: origin/${{ github.base_ref }}
          ADR_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'adr') }}

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A version bump needs a CHANGELOG.md entry (scripts/check-changelog.mjs). Required status checks make this block the merge.
      - run: pnpm changelog:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The core is held to 100% (see vitest.config.ts). One cell is enough: coverage does not vary by platform.
      - run: pnpm vitest run --coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
      # The showcase site must build before it is merged, not only when Pages deploys it from main.
      - run: pnpm build:site
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
      # Adrien checks its own decision log (the build from `pnpm test` is what runs). No --mr: a shallow checkout may lack origin/main.
      - run: node packages/cli/dist/index.js check --lint --strict
