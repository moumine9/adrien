name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A version bump needs a CHANGELOG.md entry (scripts/check-changelog.mjs). Required status checks make this block the merge.
      - run: pnpm changelog:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The core is held to 100% (see vitest.config.ts). One cell is enough: coverage does not vary by platform.
      - run: pnpm vitest run --coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
      # The showcase site must build before it is merged, not only when Pages deploys it from main.
      - run: pnpm build:site
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
      # Adrien checks its own decision log (the build from `pnpm test` is what runs). No --mr: a shallow checkout may lack origin/main.
      - run: node packages/cli/dist/index.js check --lint --strict

  # Browser checks of the web app over the mock API (packages/web/e2e). A separate job from the matrix, and a required check
  # for merging like the four `test` checks. The runner's own Chrome is used (playwright.config.ts), so no browser is downloaded.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @adrien/web test:e2e
      # A failure on the runner leaves no screen to look at: keep the traces and screenshots.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: packages/web/.shots/.results
          include-hidden-files: true
          if-no-files-found: ignore
