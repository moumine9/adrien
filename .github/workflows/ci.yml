name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The core is held to 100% (see vitest.config.ts). One cell is enough: coverage does not vary by platform.
      - run: pnpm vitest run --coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
      # Adrien checks its own decision log (the build from `pnpm test` is what runs). No --mr: a shallow checkout may lack origin/main.
      - run: node packages/cli/dist/index.js check --lint --strict
