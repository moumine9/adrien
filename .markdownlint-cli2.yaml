# Lints the repo's own docs. Biome formats Markdown too, so style rules that would fight it are left to Biome.
globs:
  - "README.md"
  - "docs/**/*.md"
ignores:
  - "node_modules/**"
  - "docs/superpowers/**" # private, never committed
  - ".superpowers/**"
  - ".local/**"
  - "docs/decisions/**" # Adrien's own log: `adrien check --lint --strict` owns it
config:
  default: true
  # The docs wrap near 120 columns and tables and links run longer.
  MD013: false
  # The README floats the mark beside its introduction; Markdown has no way to size or align an image.
  MD033:
    allowed_elements: [img]
